name: Build and publish image on new release event

on:
 release:
  types:
   - created

jobs:
  docker-image-release_push:
    # Push to Docker Hub when a new release is created
    runs-on: ubuntu-latest
    steps:

      - name: Check Out Repo
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ./
          file: ./Dockerfile
          push: true
          tags: "clinicalgenomics/hermes:${{github.event.release.tag_name}}, clinicalgenomics/hermes:latest"
          # OCI index (provenance attestation) breaks Singularity 3.1.1 on Hasta. This can be removed once we're using
          # newer versions of Apptainer/Singularity that can pull OCI image indexes everywhere (i.e. once Hasta is retired).
          # Needed on: Singularity 3.1.1
          # No longer needed on: Apptainer 1.5.3
          # See: https://docs.docker.com/build/ci/github-actions/attestations/
          provenance: false
